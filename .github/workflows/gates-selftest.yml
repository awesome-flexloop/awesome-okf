name: Gates self-test (scripts/ 变更触发)

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tasks/gates.py"
      - "tests/unit/test_no_future_annotations.py"
      - ".github/workflows/gates-selftest.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tasks/gates.py"
      - "tests/unit/test_no_future_annotations.py"
      - ".github/workflows/gates-selftest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          allow-prereleases: true
      - name: Install minimal deps
        run: pip install invoke pytest
      - name: UTF-8 gate self-test
        run: python scripts/check-utf8.py --self-test
      - name: Toctree gate self-test
        run: python scripts/check-toctrees.py --self-test
      - name: Bundles index gate self-test
        run: python scripts/check-bundles-index.py --self-test
      - name: Asset baseline gate self-test
        run: python scripts/check-asset-baseline.py --self-test
      - name: Python redline gate (PEP 563 future import 禁令, AST 检测)
        run: python -m pytest tests/unit/test_no_future_annotations.py -v
