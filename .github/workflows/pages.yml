name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Check UTF-8 validity (gate)
        run: python scripts/check-utf8.py
      - name: Check UTF-8 gate self-test (probe dual-direction)
        run: python scripts/check-utf8.py --self-test
      - name: Check toctree/index.md integrity (gate)
        run: python scripts/check-toctrees.py
      - name: Check toctree gate self-test (probe dual-direction)
        run: python scripts/check-toctrees.py --self-test
      - name: Install dependencies
        run: pip install -e ".[doc]"
      - name: Build HTML
        run: invoke build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
