name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          allow-prereleases: true
      - name: Cache Sphinx doctrees and build output
        uses: actions/cache@v5
        with:
          path: |
            _build/doctrees
            _build/html/.buildinfo
          key: ${{ runner.os }}-sphinx-py314-${{ hashFiles('doc/conf.py', 'pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sphinx-py314-${{ hashFiles('doc/conf.py', 'pyproject.toml') }}-
            ${{ runner.os }}-sphinx-py314-
      - name: Install dependencies
        run: pip install -e ".[doc]"
      - name: Check UTF-8 validity (gate)
        run: python scripts/check-utf8.py
      - name: Check toctree/index.md integrity (gate)
        run: python scripts/check-toctrees.py
      - name: Check bundles index counts (gate)
        run: python scripts/check-bundles-index.py
      - name: Build HTML (incremental, parallel)
        timeout-minutes: 25
        run: invoke build -o "-b html -j auto"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _build/html

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
