name: Deploy docs to GitHub Pages

# 2026-09 Node.js 24 兼容性清单：
#   actions/checkout@v5                 (node24)
#   actions/setup-python@v6             (node24)
#   actions/cache@v5                    (node24)
#   actions/download-artifact@v5        (node24)
#   actions/upload-pages-artifact@v4    (node24)
#   actions/deploy-pages@v5             (node24)
#   rhysd/actionlint@v1                 (node24, lints YAML)
#   dorny/paths-filter@v3               (node24, PR 域级 paths 分析)
# 每次 deprecation 周期（约 2 年）重跑一次 actionlint 校验：
#   1) docker run --rm -v $PWD:/repo rhysd/actionlint
#   2) 或 workflow 中 gates job 的 "Lint workflow files (actionlint)" step

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gates:
    name: Quality gates (utf8 / toctrees / bundles / actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Lint workflow files (actionlint) — 捕获 Node deprecated 与 YAML 错误
        uses: rhysd/actionlint@v1
        with:
          files: .github/workflows
          fail-on-error: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          allow-prereleases: true
      - name: Install minimal deps for gates
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Gate — UTF-8 validity across doc/** (含 BOM 检测)
        run: python scripts/check-utf8.py
      - name: Gate — toctree / index.md 完整性 (orphan / broken / missing bundle-root)
        run: python scripts/check-toctrees.py
      - name: Gate — bundles index 五面对账 (frontmatter / 计数行 / 分组表 / 域标题 / toctree)
        run: python scripts/check-bundles-index.py

  # --------------------------------------------------------------------------
  # P3 · VC-20：两 job 分流
  #   build-main  — push main / dispatch 直接全量单步（不走 PR 三步法，省 6.8 min warmup）
  #   build-pr    — PR 场景 3 步流水线 (WARMUP → SHARD → SAVE) 弥合 VC-5 裸文本
  # --------------------------------------------------------------------------

  build-main:
    name: Build (main/dispatch · full HTML)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: gates
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: "3.14"
          cache: "pip"
          allow-prereleases: true
      - name: "Cache Sphinx environment.pickle (P1-D L2-A: 仅单文件 + 精确key + 7d)"
        uses: actions/cache@v5
        with:
          path: |
            _build/doctrees/environment.pickle
          # VC-1 / VC-9：ref_name 分命名空间；pyproject.toml 版本变更自动 miss
          key: >-
            ${{ runner.os }}-${{ github.ref_name }}-py${{ steps.setup-python.outputs.python-version }}-dFULL-env-v1-
            ${{ hashFiles('doc/conf.py', 'pyproject.toml', 'doc/bundles/index.md', 'doc/index.md', 'doc/_static/**') }}
          retention-days: 7
          save-always: false
      - name: Install doc dependencies
        run: pip install -e ".[doc]"
      - name: Build HTML (full)
        timeout-minutes: 55
        run: >-
          invoke build
          -o "-b html -d _build/doctrees --keep-going"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _build/html

  build-pr:
    name: Build (PR · WARMUP invs → SHARD → SAVE)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: gates
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # PR · P2：dorny/paths-filter@v3 按 9 域+全局推断 OKF_BUILD_DOMAIN（VC-8 锁定版本）
      - name: Analyze changed files → OKF_BUILD_DOMAIN
        id: domain-filter
        uses: dorny/paths-filter@v3
        with:
          list-files: 'none'
          filters: |
            global:
              - 'doc/conf.py'
              - 'doc/index.md'
              - 'doc/bundles/index.md'
              - 'doc/_static/**'
              - 'pyproject.toml'
              - 'tasks/**'
              - '.github/workflows/**'
            meta:   - 'doc/bundles/meta/**'
            guoxue: - 'doc/bundles/guoxue/**'
            zhexue: - 'doc/bundles/zhexue/**'
            kexue:  - 'doc/bundles/kexue/**'
            wenxue: - 'doc/bundles/wenxue/**'
            yixue:  - 'doc/bundles/yixue/**'
            sheke:  - 'doc/bundles/sheke/**'
            yishu:  - 'doc/bundles/yishu/**'
            jishu:  - 'doc/bundles/jishu/**'
      # VC-9 / VC-10 / VC-11：后处理最终值
      - name: Resolve OKF_BUILD_DOMAIN final value
        id: resolve-domain
        run: |
          PR_FULL_LABEL="${{ contains(github.event.pull_request.labels.*.name, 'pr-full') }}"
          GLOBAL_CHANGED="${{ steps.domain-filter.outputs.global }}"
          if [ "$PR_FULL_LABEL" = "true" ] || [ "$GLOBAL_CHANGED" = "true" ]; then
            unset OKF_BUILD_DOMAIN
          else
            # VC-11 fix：GHA expression 解析阶段先于 bash，禁止在 ${{ }} 内嵌套 bash $d
            # 先用字面量键名逐个展开，再由 bash 间接引用取值
            CHANGED_meta="${{ steps.domain-filter.outputs.meta }}"
            CHANGED_guoxue="${{ steps.domain-filter.outputs.guoxue }}"
            CHANGED_zhexue="${{ steps.domain-filter.outputs.zhexue }}"
            CHANGED_kexue="${{ steps.domain-filter.outputs.kexue }}"
            CHANGED_wenxue="${{ steps.domain-filter.outputs.wenxue }}"
            CHANGED_yixue="${{ steps.domain-filter.outputs.yixue }}"
            CHANGED_sheke="${{ steps.domain-filter.outputs.sheke }}"
            CHANGED_yishu="${{ steps.domain-filter.outputs.yishu }}"
            CHANGED_jishu="${{ steps.domain-filter.outputs.jishu }}"
            DOMAINS=""
            for d in meta guoxue zhexue kexue wenxue yixue sheke yishu jishu; do
              _varname="CHANGED_${d}"
              CHANGED="${!_varname}"
              if [ "$CHANGED" = "true" ]; then DOMAINS="${DOMAINS}${d} "; fi
            done
            COUNT=$(echo $DOMAINS | wc -w)
            if [ "$COUNT" -eq 1 ]; then
              OKF_BUILD_DOMAIN=$(echo "$DOMAINS" | xargs)
            else
              unset OKF_BUILD_DOMAIN
            fi
          fi
          echo "OKF_BUILD_DOMAIN=${OKF_BUILD_DOMAIN}" >> $GITHUB_ENV
          echo "[OKF] final OKF_BUILD_DOMAIN='${OKF_BUILD_DOMAIN}' (empty = full build)"
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: "3.14"
          cache: "pip"
          allow-prereleases: true

      # ==============================================================
      # PR · STEP 1 — WARMUP：9 域 objects.inv（P3 弥合 VC-5 裸文本）
      # VC-14：cache key 包含 doc/bundles/**/*.md 全量 hash（不放过任何事实页变更）
      # ==============================================================
      - name: Cache domain-invs/*.inv (P3 WARMUP)
        id: cache-domain-invs
        uses: actions/cache@v5
        with:
          path: |
            _build/domain-invs
          # P3 VC-14：doc/bundles/**/*.md（全量 md）+ 配置；inv 总 ~0.5MB，可忽略存储成本
          key: >-
            ${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-dinv-v1-
            ${{ hashFiles('doc/bundles/**/*.md', 'doc/conf.py', 'pyproject.toml') }}
          save-always: true
      - name: Install doc dependencies
        run: pip install -e ".[doc]"
      - name: WARMUP — Generate 9 domain invs (cache miss)
        if: steps.cache-domain-invs.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: invoke build-invs

      # ==============================================================
      # PR · STEP 2 — SHARD：按 OKF_BUILD_DOMAIN 分片/全量构建 HTML
      # VC-19：显式设置 OKF_INV_DIR 绝对路径（跨 cwd 共享）
      # ==============================================================
      - name: Cache Sphinx environment.pickle (per domain/full)
        uses: actions/cache@v5
        with:
          path: |
            _build/doctrees/environment.pickle
          key: >-
            ${{ runner.os }}-${{ github.ref_name }}-py${{ steps.setup-python.outputs.python-version }}-d${{ env.OKF_BUILD_DOMAIN || 'FULL' }}-env-v1-
            ${{ hashFiles('doc/conf.py', 'pyproject.toml', 'doc/bundles/index.md', 'doc/index.md', 'doc/_static/**') }}
          retention-days: 7
          save-always: false
      - name: SHARD — Build HTML (with cross-domain invs · VC-19 absolute path)
        timeout-minutes: 55
        run: |
          export OKF_INV_DIR="${GITHUB_WORKSPACE}/_build/domain-invs"
          invoke build \
            -o "-b html -d _build/doctrees --keep-going"

      # ==============================================================
      # PR · STEP 3 — SAVE invs back to cache（VC-20+cache-always-true 自动）
      # actions/cache@v5 已在 post step 执行 save；无需额外步骤
      # ==============================================================
      - name: Verify PR artifact — list inv + built HTML（非 upload，CI 红 debug 用）
        run: |
          ls -la _build/domain-invs || true
          find _build/domain-invs -type f -name '*.inv' -exec wc -c {} \;
          test -f _build/html/index.html && echo "✅ _build/html/index.html OK"

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-main
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
