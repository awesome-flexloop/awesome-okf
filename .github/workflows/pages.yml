name: Deploy docs to GitHub Pages

# 2026-09 Node.js 24 兼容性清单：
#   actions/checkout@v5                 (node24)
#   actions/setup-python@v6             (node24)
#   actions/cache@v5                    (node24)
#   actions/download-artifact@v5        (node24)
#   actions/upload-pages-artifact@v4    (node24)
#   actions/deploy-pages@v5             (node24)
#   rhysd/actionlint@v1                 (node24, lints YAML)
# 每次 deprecation 周期（约 2 年）重跑一次 actionlint 校验：
#   1) docker run --rm -v $PWD:/repo rhysd/actionlint
#   2) 或 workflow 中 gates job 的 "Lint workflow files (actionlint)" step

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gates:
    name: Quality gates (utf8 / toctrees / bundles / actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Lint workflow files (actionlint) — 捕获 Node deprecated 与 YAML 错误
        uses: rhysd/actionlint@v1
        with:
          files: .github/workflows
          fail-on-error: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          allow-prereleases: true
      - name: Install minimal deps for gates
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Gate — UTF-8 validity across doc/** (含 BOM 检测)
        run: python scripts/check-utf8.py
      - name: Gate — toctree / index.md 完整性 (orphan / broken / missing bundle-root)
        run: python scripts/check-toctrees.py
      - name: Gate — bundles index 五面对账 (frontmatter / 计数行 / 分组表 / 域标题 / toctree)
        run: python scripts/check-bundles-index.py

  build:
    name: Sphinx build (incremental doctree cache)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: gates
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: "3.14"
          cache: "pip"
          allow-prereleases: true
      - name: Cache Sphinx environment.pickle (V-3: 仅单文件 + 分支后缀 + 7d retention 防 LRU 击穿)
        uses: actions/cache@v5
        with:
          # V-3 采纳修正：仅缓存 BuildEnv 根 pickle（串行瓶颈，≈200MB），
          # 不缓存整个 doctrees/ 目录（500MB+ → 单仓 10GB LRU 快速 eviction → ROI 负）。
          path: |
            _build/doctrees/environment.pickle
          # V-3 分支后缀：不同 ref（main/feature/PR）各建独立命名空间，
          # 防止跨分支 doctree schema 不兼容静默命中造成神秘崩溃。
          # key 失效粒度：OS + Python 版本 + 分支 + 配置/主题/域入口索引哈希。
          key: >-
            ${{ runner.os }}-${{ github.ref_name }}-py${{ steps.setup-python.outputs.python-version }}-env-v1-
            ${{ hashFiles('doc/conf.py', 'pyproject.toml', 'doc/bundles/index.md', 'doc/index.md', 'doc/_static/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.ref_name }}-py${{ steps.setup-python.outputs.python-version }}-env-v1-${{ hashFiles('doc/conf.py', 'pyproject.toml') }}-
            ${{ runner.os }}-${{ github.ref_name }}-py${{ steps.setup-python.outputs.python-version }}-env-v1-
          # V-3 retention：GitHub Actions 单仓缓存上限 10 GB，仅保留 7 天，
          # 让长期未触及的旧分支 pickle 自动让位给主力 main 分支的热数据。
          retention-days: 7
          # Sphinx 构建中途 warning→error 崩溃时 pickle 仍完整（已完成 read 阶段），
          # 失败也保存，避免下次失败重跑从零重建 9622 文件 BuildEnv。
          save-always: true
      - name: Install doc dependencies
        run: pip install -e ".[doc]"
      - name: Build HTML (增量 doctree + 并行渲染)
        # I-3 修复：留给 Sphinx 的单步预算提升到 55 min (job 总预算 60 - 预留 5 min 上传 artifact)
        timeout-minutes: 55
        # 解释 opts：
        #   -b html         输出 html (默认)
        #   -j auto         按 runner CPU 核数并行 (ubuntu-latest=2 → 2 worker)
        #   -W --keep-going  warning→error 但收集完所有告警 (方便一次性修)
        #   -d _build/doctrees 显式指定 doctree 目录，确保 cache@v5 路径与 Sphinx 写入一致
        run: >-
          invoke build
          -o "-b html -j auto -d _build/doctrees --keep-going"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _build/html

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
